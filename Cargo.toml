[package]
name = "rbl-studio"
version = "0.8.0"
edition = "2021"
rust-version = "1.85"
description = "Native desktop IDE for Reiwa Bat Language"
license = "Apache-2.0"

[[bin]]
name = "rbl-studio"
path = "src/main.rs"
required-features = ["legacy-egui"]

[[bin]]
name = "rbl-studio-worker"
path = "src/bin/rbl-studio-worker.rs"

[features]
default = []
# The old egui application is retained for development/rollback only. Keep its
# heavy GUI dependencies out of the wxWidgets worker's default build graph.
legacy-egui = ["dep:eframe", "dep:rfd"]

[dependencies]
anyhow = "1.0"
crossbeam-channel = "0.5"
dirs = "6.0"
eframe = { version = "0.31.1", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"], optional = true }
rfd = { version = "0.15.3", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.20"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

